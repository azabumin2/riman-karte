<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FDF6F0;--s1:#FBF0F4;--s2:#FFFFFF;
  --bd:rgba(180,100,130,.14);--bds:rgba(180,100,130,.28);
  --tp:#3D2B35;--ts:#7A5566;--tm:#AA8899;
  --p50:#FBEAF0;--p100:#F4C0D1;--p200:#ED93B1;--p400:#D4537E;--p600:#993556;--p800:#72243E;
  --sbg:#E8F5E9;--sc:#2E7D32;--wbg:#FFF3E0;--wc:#E65100;--dbg:#FFEBEE;--dc:#C62828;
  --r:10px;--rl:14px;--sh:0 2px 14px rgba(180,100,130,.09);
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;}
button,input,textarea{font-family:inherit;}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);}
.top-nav{position:sticky;top:0;z-index:100;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;padding:0 2px;}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border:none;background:none;position:relative;cursor:pointer;}
.ntab .ti{font-size:20px;color:var(--tm);}
.ntab span{font-size:10px;color:var(--tm);font-weight:400;}
.ntab.on .ti,.ntab.on span{color:var(--p400);}
.ntab.on span{font-weight:500;}
.ntab.on::after{content:'';position:absolute;bottom:0;width:20px;height:2px;background:var(--p400);border-radius:2px 2px 0 0;}
.scr{padding:16px;}
.serif{font-family:'Noto Serif JP',serif;}
.card{background:var(--s2);border-radius:var(--rl);border:1px solid var(--bd);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);}
.cp{cursor:pointer;transition:border-color .15s;}
.cp:hover{border-color:var(--p200);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--r);font-size:14px;font-weight:500;border:none;cursor:pointer;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.bp{background:var(--p400);color:#fff;}
.bo{background:transparent;color:var(--p400);border:1px solid var(--p400);}
.bg{background:var(--p50);color:var(--p600);}
.bd2{background:transparent;color:var(--dc);border:1px solid #F4A0A0;}
.bw{width:100%;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:12px;color:var(--tm);margin-bottom:4px;font-weight:500;}
.fld input,.fld textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bds);background:var(--s2);color:var(--tp);font-size:14px;outline:none;}
.fld textarea{resize:vertical;min-height:62px;display:block;}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.chip{padding:8px 10px;border-radius:var(--r);font-size:12px;border:1px solid var(--bds);background:var(--s2);color:var(--ts);cursor:pointer;text-align:center;user-select:none;}
.chip.on{border:2px solid var(--p400);background:var(--p50);color:var(--p600);font-weight:500;}
.av{border-radius:50%;background:linear-gradient(135deg,var(--p100),var(--p400));display:flex;align-items:center;justify-content:center;color:var(--p800);font-weight:500;flex-shrink:0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btr{flex:1;background:var(--s1);border-radius:3px;height:6px;overflow:hidden;}
.bf{height:100%;border-radius:3px;transition:width .8s ease;}
.movo{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.mov{background:var(--s2);border-radius:var(--rl) var(--rl) 0 0;padding:24px 20px;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;}
.sdots{display:flex;gap:4px;margin-bottom:20px;}
.sdot{height:4px;border-radius:2px;transition:all .3s;}
.lsb{flex:1;padding:8px 4px;border-radius:8px;cursor:pointer;border:1px solid var(--bds);background:var(--s2);color:var(--ts);font-size:11px;line-height:1.3;text-align:center;}
.lsb.on{border:2px solid var(--p400);background:var(--p50);color:var(--p600);font-weight:500;}
.prev-img{width:100%;border-radius:12px;display:block;margin-bottom:14px;}
</style>
</head>

<div class="app">

</div>

  m.appendChild(h("p","",{fontSize:"14px",color:"var(--ts)",lineHeight:"1.8",marginBottom:"20px"},["無料体験の診断回数が残り"+(MAX_LIMIT-count)+"回となりました。引き続きご利用をご希望の方はお早めにお申し込みください。"]));
  var box=h("div","card",{background:"var(--p50)",border:"1px solid var(--p100)",textAlign:"left",marginBottom:"16px"});
  box.appendChild(h("p","",{fontSize:"12px",color:"var(--tm)",marginBottom:"8px",fontWeight:"500"},["お申し込み・お問い合わせ"]));
  box.appendChild(h("p","",{fontSize:"15px",fontWeight:"500",color:"var(--p600)",marginBottom:"4px"},["株式会社PRIAMOS"]));
  box.appendChild(h("p","",{fontSize:"13px",color:"var(--ts)",marginBottom:"4px"},["📧 azabumin@gmail.com"]));
  box.appendChild(h("p","",{fontSize:"11px",color:"var(--tm)",marginTop:"8px"},["担当者よりご連絡いたします。"]));

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function today(){return new Date().toISOString().split("T")[0];}

/* ===== DOM HELPERS ===== */
/* h(tag, className, styleObj, childrenArray) - all params optional except tag */
function h(tag,cls,sty,ch){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(sty&&typeof sty==="object"&&!Array.isArray(sty)){
    var keys=Object.keys(sty);
    for(var k=0;k<keys.length;k++)e.style[keys[k]]=sty[keys[k]];
  }
  var arr=Array.isArray(ch)?ch:(Array.isArray(sty)?sty:[]);
  for(var i=0;i<arr.length;i++){
    if(arr[i]==null)continue;
    e.appendChild(typeof arr[i]==="string"?document.createTextNode(arr[i]):arr[i]);
  }
  return e;
}
function ic(name,sty){
  var i=document.createElement("i");
  i.className="ti "+name;
  i.setAttribute("aria-hidden","true");
  if(sty&&typeof sty==="object"){var keys=Object.keys(sty);for(var k=0;k<keys.length;k++)i.style[keys[k]]=sty[keys[k]];}
  return i;
}
function av(name,sz){
  return h("div","av",{width:sz+"px",height:sz+"px",fontSize:Math.round(sz*.38)+"px"},[name.charAt(0)]);
}
function stag(type){
  var s=SKINC[type]||{bg:"var(--p50)",c:"var(--p600)"};
  return h("span","tag",{background:s.bg,color:s.c},[type]);
}
function mkBtn(lbl,oc,cls,dis){
  var b=h("button",cls||"btn bp");
  b.innerHTML=lbl;
  if(oc)b.addEventListener("click",oc);
  if(dis)b.disabled=true;
  return b;
}
function mkFld(lbl,val,oc,type,ph){
  var w=h("div","fld");
  if(lbl)w.appendChild(h("label","",{},[lbl]));
  var i=document.createElement("input");
  i.type=type||"text"; i.value=val||""; if(ph)i.placeholder=ph;
  i.addEventListener("input",function(e){oc(e.target.value);});
  w.appendChild(i); return w;
}
function txt(str){return document.createTextNode(str);}
function row(children,gap){
  var d=h("div","",{display:"flex",gap:gap||"8px"});
  for(var i=0;i<children.length;i++)if(children[i])d.appendChild(children[i]);
  return d;
}

/* ===== NAVIGATION ===== */
function renderNav(){
  var nav=document.getElementById("nav"); nav.innerHTML="";
  var tabs=[
    {id:"home",ic:"ti-home",l:"ホーム"},
    {id:"members",ic:"ti-users",l:"会員"},
    {id:"diagnosis",ic:"ti-camera",l:"診断"},
    {id:"products",ic:"ti-leaf",l:"商品"}
  ];
  for(var i=0;i<tabs.length;i++){
    (function(tab){
      var b=h("button","ntab"+(S.tab===tab.id?" on":""));
      b.appendChild(ic(tab.ic));
      b.appendChild(h("span","",{},[tab.l]));
      b.addEventListener("click",function(){
        if(tab.id==="_set"){showSettings();return;}
        S.tab=tab.id;
        if(tab.id==="diagnosis"){if(!checkLimit())return;S.diag=newDiag();}
        S.view=tab.id;
        render();
      });
      nav.appendChild(b);
    })(tabs[i]);
  }
}

function render(){
  renderNav();
  var c=document.getElementById("content"); c.innerHTML="";
  var views={home:renderHome,members:renderMembers,detail:renderDetail,diagnosis:renderDiag,products:renderProducts};
  (views[S.view]||renderHome)(c);
}

/* ===== SETTINGS ===== */
var ADMIN_PW="priamos2024";
function checkAdmin(callback){
  var mr=document.getElementById("modal");mr.innerHTML="";
  var ov=h("div","movo");
  var m=h("div","mov",{textAlign:"center"});
  m.appendChild(h("div","",{fontSize:"36px",marginBottom:"8px"},["🔐"]));
  m.appendChild(h("h2","serif",{fontSize:"18px",fontWeight:"500",marginBottom:"4px"},["管理者認証"]));
  m.appendChild(h("p","",{fontSize:"13px",color:"var(--tm)",marginBottom:"16px"},["管理者パスワードを入力してください"]));
  var pw=document.createElement("input");
  pw.type="password";pw.placeholder="パスワード";
  pw.style.cssText="width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--bds);background:var(--s2);color:var(--tp);font-size:15px;box-sizing:border-box;margin-bottom:8px;outline:none;text-align:center;letter-spacing:4px;";
  m.appendChild(pw);
  var errMsg=h("p","",{fontSize:"12px",color:"var(--dc)",marginBottom:"12px",minHeight:"18px"},[""]);
  m.appendChild(errMsg);
  var okBtn=mkBtn("確認",function(){
    if(pw.value===ADMIN_PW){mr.innerHTML="";callback();}
    else{errMsg.textContent="パスワードが違います";pw.value="";pw.focus();}
  },"btn bp bw");
  m.appendChild(okBtn);
  var canBtn=mkBtn("キャンセル",function(){mr.innerHTML="";},"btn bg bw");
  canBtn.style.marginTop="8px";
  m.appendChild(canBtn);
  pw.addEventListener("keydown",function(e){if(e.key==="Enter")okBtn.click();});
  ov.appendChild(m);
  mr.appendChild(ov);
  setTimeout(function(){pw.focus();},100);
}
function showSettings(){
  var mr=document.getElementById("modal"); mr.innerHTML="";
  var ov=h("div","movo");
  var m=h("div","mov");

  var hdr=h("div","",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"});
  hdr.appendChild(h("h2","serif",{fontSize:"18px",fontWeight:"500"},["API 設定"]));
  hdr.appendChild(mkBtn("✕",function(){mr.innerHTML="";},"btn bg"));
  m.appendChild(hdr);

  m.appendChild(h("p","",{fontSize:"13px",color:"var(--tm)",marginBottom:"16px",lineHeight:"1.7"},["Claude AI による肌写真診断には Anthropic API キーが必要です。キーはこの端末のみに保存されます。"]));

  var kw=h("div","fld");kw.appendChild(h("label","",{},["Anthropic API Key"]));
  var ki=document.createElement("input");ki.type="password";ki.placeholder="sk-ant-api03-...";ki.value=getKey();
  ki.style.cssText="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bds);background:var(--s2);color:var(--tp);font-size:14px;";
  kw.appendChild(ki); m.appendChild(kw);

  var lnk=h("p","",{fontSize:"12px",color:"var(--tm)",marginBottom:"16px"},["APIキーは "]);
  var a=document.createElement("a");a.href="https://console.anthropic.com";a.target="_blank";a.textContent="console.anthropic.com";a.style.color="var(--p400)";
  lnk.appendChild(a);lnk.appendChild(txt(" で取得できます。"));m.appendChild(lnk);

  m.appendChild(mkBtn("保存する",function(){setKey(ki.value.trim());mr.innerHTML="";alert("APIキーを保存しました。");},"btn bp bw"));
  m.appendChild(h("div","",{height:"1px",background:"var(--bd)",margin:"20px 0"}));
  m.appendChild(h("p","",{fontSize:"13px",fontWeight:"500",marginBottom:"8px"},["データ管理"]));

  m.appendChild(mkBtn("CSVエクスポート",function(){
    var rows=[["氏名","年齢","電話番号","肌タイプ","お悩み","メモ","最終診断日","登録日"]];
    for(var i=0;i<customers.length;i++){
      var c=customers[i];
      rows.push([c.name,c.age||"",c.phone||"",c.skinType||"",(c.concerns||[]).join(" / "),c.memo||"",c.lastDiagnosis||"",c.createdAt||""]);
    }
    var csv="\uFEFF"+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
    var a2=document.createElement("a");a2.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a2.download="riman_karte_"+today()+".csv";a2.click();
  },"btn bg bw"));

  ov.appendChild(m);
  ov.addEventListener("click",function(e){if(e.target===ov)mr.innerHTML="";});
  mr.appendChild(ov);
}

/* ===== HOME ===== */
function renderHome(c){
  var sc=h("div","scr");

  var titleRow=h("div","",{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"24px"});

        r.appendChild(h("div","",{width:"56px",fontSize:"12px",color:"var(--ts)"},[d.t]));
        r.appendChild(tr);
        r.appendChild(h("div","",{fontSize:"12px",fontWeight:"500",color:"var(--p400)",width:"20px",textAlign:"right"},[String(d.n)]));
        box.appendChild(r);
      })(dist[ddi]);
    }
    sc.appendChild(box);
  }

  var sorted=customers.slice().sort(function(a,b){return (b.lastDiagnosis||"").localeCompare(a.lastDiagnosis||"");});
  var recent=sorted.slice(0,3);
  var rh=h("div","",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"});
  rh.appendChild(h("p","",{fontSize:"13px",fontWeight:"500"},["最近の会員"]));
  var ab=document.createElement("button");ab.style.cssText="background:none;border:none;color:var(--p400);font-size:12px;cursor:pointer;";ab.textContent="すべて見る →";
  ab.addEventListener("click",function(){S.view="members";S.tab="members";render();});
  rh.appendChild(ab);sc.appendChild(rh);

  for(var ri=0;ri<recent.length;ri++){
    (function(cu){

/* ===== DIAGNOSIS ===== */
function renderDiag(c){
  var d=S.diag;

  bb.appendChild(ic("ti-arrow-left",{fontSize:"20px"}));
  bb.addEventListener("click",function(){
    if(d.step===0){S.view="home";S.tab="home";render();return;}
    if(d.step===4){d.step=2;d.result=null;}
    else d.step=Math.max(0,d.step-1);
    rfD();
  });
  top.appendChild(bb);

  var stepLabel=d.step<4?"STEP "+(d.step+1)+" / 3":"診断完了";
  var stepTitle=d.step<4?"肌写真診断":"診断結果";

  hinfo.appendChild(h("h1","serif",{margin:"2px 0 0",fontSize:"18px",fontWeight:"500"},[stepTitle]));
  top.appendChild(hinfo);
  sc.appendChild(top);

  /* ステップドット */
  var dotsEl=h("div","sdots");
  for(var di=0;di<3;di++){
    dotsEl.appendChild(h("div","sdot",{flex:di===d.step?"2":"1",background:di<=d.step?"var(--p400)":"var(--bds)"}));
  }

  var main=h("div");sc.appendChild(main);c.appendChild(sc);

  function rfD(){
    main.innerHTML="";
    if(d.step<4)main.appendChild(dotsEl);
    if(d.step===0)rfS0();
    else if(d.step===1)rfS1();
    else if(d.step===2)rfS2();
    else if(d.step===4)rfResult();

  /* --- STEP 0: 会員選択 --- */
  function rfS0(){
    main.appendChild(h("p","",{fontSize:"15px",fontWeight:"500",marginBottom:"12px"},["診断対象の会員を選んでください"]));

    ]);

    var nextDiv=h("div","",{marginTop:"16px"});
    var dis=d.isNew?!d.newC.name.trim():!d.cId;
    var nextB=mkBtn("次へ →",function(){d.step=1;rfD();},"btn bp bw",dis);

    if(d.isNew){
      var box=h("div","card");
      var nf=mkFld("お名前 *",d.newC.name,function(v){d.newC.name=v;nextB.disabled=!v.trim();},"text","田中 美代子");
      var rg=h("div","g2");

      box.appendChild(nf);box.appendChild(rg);

          r.addEventListener("click",function(){d.cId=cu.id;rfD();});

          r.appendChild(inner);main.appendChild(r);
        })(customers[i]);
      }

    nextDiv.appendChild(nextB);
    main.appendChild(nextDiv);

  /* --- STEP 1: 写真撮影 ---
     capture="user" → スマホではフロントカメラが直接起動（HTTPS不要）
     capture属性なし → ギャラリーから選択 */
  function rfS1(){
    main.appendChild(h("p","",{fontSize:"15px",fontWeight:"500",marginBottom:"4px"},["顔写真を撮影してください"]));

        mkBtn("撮り直す",function(){d.photo=null;rfD();},"btn bo bw"),

      ]));

      illust.appendChild(h("p","",{fontSize:"11px",color:"var(--p200)",marginTop:"6px"},["明るい場所・すっぴんまたは薄化粧が理想的です"]));

        var f=e.target.files[0];if(!f)return;

      if(!cu)cu={name:"",age:""};
      var base64=d.photo.split(",")[1];
      var mediaType=d.photo.indexOf("data:image/png")===0?"image/png":"image/jpeg";
      var prompt="あなたは経験豊富な美容専門家です。この顔写真から肌状態を詳しく分析してください。\n\nお客様情報:\n- 名前: "+cu.name+"\n- 年齢: "+(cu.age||"不明")+"歳代\n- 睡眠の質: "+d.ls.sleep+"\n- 水分摂取: "+d.ls.water+"\n- 紫外線対策: "+d.ls.uv+"\n- 備考: "+(d.note||"なし")+"\n\n写真から以下を分析し、JSONのみで回答してください（説明文・コードブロック記号は不要）:\n\n{\"skinType\":\"乾燥肌/普通肌/混合肌/脂性肌/敏感肌のいずれか1つ\",\"skinDiagnosis\":\"写真から見た肌の総合診断（60字以内）\",\"concerns\":[\"写真から判断したお悩み1\",\"お悩み2\",\"お悩み3\"],\"skinCondition\":{\"hydration\":保水力1から10,\"elasticity\":弾力1から10,\"sensitivity\":敏感度1から10,\"brightness\":透明感1から10},\"advice\":[\"スキンケアアドバイス1\",\"アドバイス2\",\"アドバイス3\",\"アドバイス4\"],\"productCategories\":[\"RIMANおすすめカテゴリ1\",\"カテゴリ2\",\"カテゴリ3\"],\"urgencyLevel\":\"高または中または低\"}";

      if(!checkLimit())return;
      var newCount=addCount();
      if(newCount===WARN_LIMIT){setTimeout(function(){showWarnPopup(newCount);},1500);}

      fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:1200,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
            {type:"text",text:prompt}
          ]}]
        })
      }).then(function(res){return res.json();}).then(function(data){
        if(data.error)throw new Error(data.error.message||"APIエラー");
        var content=data.content||[];
        var txt2="";
        for(var i=0;i<content.length;i++)if(content[i].type==="text"){txt2=content[i].text;break;}
        d.result=JSON.parse(txt2.replace(/```json|```/g,"").trim());
        d.step=4;d.loading=false;rfD();
      }).catch(function(e){
        d.error="診断エラー: "+(e.message||"再度お試しください");
        d.loading=false;rfD();
      });
    },"btn bp bw",!canRun));

    if(d.loading)main.appendChild(h("p","",{textAlign:"center",color:"var(--tm)",fontSize:"13px",marginTop:"12px"},["顔写真をAIが分析しています..."]));
  }

  /* --- STEP 4: 診断結果 --- */
  function rfResult(){
    var r=d.result;if(!r)return;
    var cu=null;
    if(d.isNew)cu={name:d.newC.name};
    else{for(var i=0;i<customers.length;i++)if(customers[i].id===d.cId){cu=customers[i];break;}}
    if(!cu)cu={name:""};

    main.appendChild(h("div","",{textAlign:"center",marginBottom:"20px"},[
      h("div","",{fontSize:"32px",marginBottom:"4px"},["✨"]),
      h("p","",{fontSize:"13px",color:"var(--tm)"},[cu.name+" 様の肌診断結果"])
    ]));

    /* 診断サマリー */
    var sb=h("div","card",{background:"linear-gradient(135deg,var(--p50),#FDF9FB)",border:"1px solid var(--p100)",marginBottom:"12px"});
    if(d.photo){
      var pi=h("div","",{display:"flex",gap:"14px",alignItems:"flex-start"});
      var pimg=document.createElement("img");pimg.src=d.photo;pimg.style.cssText="width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0;";
      pi.appendChild(pimg);
      var pinfo=h("div","",{flex:"1"});
      if(r.skinType)pinfo.appendChild(h("div","",{marginBottom:"6px"},[stag(r.skinType)]));
      pinfo.appendChild(h("p","",{fontSize:"13px",fontWeight:"500",lineHeight:"1.7"},[r.skinDiagnosis||""]));
      if(r.urgencyLevel){
        var uc={高:{bg:"var(--dbg)",c:"var(--dc)"},中:{bg:"var(--wbg)",c:"var(--wc)"},低:{bg:"var(--sbg)",c:"var(--sc)"}}[r.urgencyLevel]||{bg:"var(--p50)",c:"var(--p600)"};
        pinfo.appendChild(h("div","",{marginTop:"8px"},[h("span","tag",{background:uc.bg,color:uc.c},["ケア優先度: "+r.urgencyLevel])]));
      }
      pi.appendChild(pinfo);sb.appendChild(pi);
    }else{
      if(r.skinType)sb.appendChild(h("div","",{marginBottom:"6px"},[stag(r.skinType)]));
      sb.appendChild(h("p","",{fontSize:"13px",fontWeight:"500",lineHeight:"1.7"},[r.skinDiagnosis||""]));
    }
    main.appendChild(sb);

    /* 写真から判断したお悩み */
    var concerns=r.concerns||[];
    if(concerns.length){
      var cb=h("div","card",{marginBottom:"12px"});
      cb.appendChild(h("p","",{fontSize:"11px",color:"var(--tm)",fontWeight:"500",marginBottom:"8px"},["写真から判断したお悩み"]));
      var ctgs=h("div","",{display:"flex",flexWrap:"wrap",gap:"6px"});
      for(var ci=0;ci<concerns.length;ci++)ctgs.appendChild(h("span","tag",{background:"var(--p50)",color:"var(--p600)"},[concerns[ci]]));
      cb.appendChild(ctgs);main.appendChild(cb);
    }

    /* スコア */
    if(r.skinCondition){
      var scorebox=h("div","card",{marginBottom:"12px"});
      scorebox.appendChild(h("p","",{fontSize:"11px",color:"var(--tm)",fontWeight:"500",marginBottom:"12px"},["肌コンディション（写真分析）"]));
      var scoreItems=[{key:"hydration",l:"保水力"},{key:"elasticity",l:"弾力"},{key:"sensitivity",l:"敏感度"},{key:"brightness",l:"透明感"}];
      for(var si=0;si<scoreItems.length;si++){
        (function(item){
          var v=r.skinCondition[item.key]||5;
          var bad=item.key==="sensitivity";
          var col=bad?(v>=7?"var(--dc)":v>=4?"var(--wc)":"var(--sc)"):(v>=7?"var(--sc)":v>=4?"var(--wc)":"var(--dc)");
          var bg=bad?(v>=7?"var(--dbg)":v>=4?"var(--wbg)":"var(--sbg)"):(v>=7?"var(--sbg)":v>=4?"var(--wbg)":"var(--dbg)");
          var rw=h("div","",{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"});
          var tr=h("div","btr");tr.appendChild(h("div","bf",{width:(v*10)+"%",background:col}));
          rw.appendChild(h("div","",{width:"54px",fontSize:"12px",color:"var(--ts)"},[item.l]));
          rw.appendChild(tr);
          rw.appendChild(h("span","tag",{background:bg,color:col,minWidth:"26px",textAlign:"center"},[String(v)]));
          scorebox.appendChild(rw);
        })(scoreItems[si]);
      }
      main.appendChild(scorebox);
    }

    /* アドバイス */
    var advice=r.advice||[];
    if(advice.length){
      var ab=h("div","card",{marginBottom:"12px"});
      ab.appendChild(h("p","",{fontSize:"11px",color:"var(--tm)",fontWeight:"500",marginBottom:"10px"},["スキンケアアドバイス"]));
      for(var ai=0;ai<advice.length;ai++){
        var rw2=h("div","",{display:"flex",gap:"8px",fontSize:"13px",color:"var(--tp)",lineHeight:"1.6",marginBottom:"8px"});
        rw2.appendChild(h("span","",{color:"var(--p400)",flexShrink:"0"},["✦"]));
        rw2.appendChild(txt(advice[ai]));
        ab.appendChild(rw2);
      }
      main.appendChild(ab);
    }

    /* 商品カテゴリ */
    var pc=r.productCategories||[];
    if(pc.length){
      var pb=h("div","card",{background:"var(--p50)",border:"1px solid var(--p100)",marginBottom:"16px"});
      pb.appendChild(h("p","",{fontSize:"12px",fontWeight:"500",color:"var(--p800)",marginBottom:"10px"},["🌸 おすすめ商品カテゴリ（RIMAN KOREA）"]));
      for(var pci=0;pci<pc.length;pci++)pb.appendChild(h("div","",{padding:"8px 12px",background:"var(--s2)",borderRadius:"8px",marginBottom:"6px",fontSize:"13px",color:"var(--p600)",fontWeight:"500"},[pc[pci]]));
      pb.appendChild(h("p","",{fontSize:"11px",color:"var(--tm)",marginTop:"8px"},["※ 商品タブにRIMAN商品を登録後、具体的な商品名で提案されます"]));
      main.appendChild(pb);
    }

    var acts=h("div","",{display:"flex",flexDirection:"column",gap:"8px"});
    acts.appendChild(mkBtn("カルテに保存する",function(){
      var rec={id:genId(),date:today(),skinType:r.skinType||"",concerns:r.concerns||[],lifestyle:d.ls,note:d.note,skinDiagnosis:r.skinDiagnosis,skinCondition:r.skinCondition,advice:r.advice,productCategories:r.productCategories,urgencyLevel:r.urgencyLevel};
      if(d.isNew){
        var nc={id:genId(),name:d.newC.name,age:parseInt(d.newC.age)||0,phone:d.newC.phone,memo:"",skinType:r.skinType||"",concerns:r.concerns||[],diagnoses:[rec],lastDiagnosis:today(),createdAt:today()};
        customers.push(nc);saveDB();S.selId=nc.id;
      }else{
        for(var i=0;i<customers.length;i++){
          if(customers[i].id===d.cId){
            customers[i].skinType=r.skinType||customers[i].skinType;
            customers[i].concerns=r.concerns||customers[i].concerns;
            customers[i].lastDiagnosis=today();
            if(!customers[i].diagnoses)customers[i].diagnoses=[];
            customers[i].diagnoses.push(rec);
            break;
          }
        }
        saveDB();S.selId=d.cId;
      }
      S.view="detail";S.tab="members";render();
    },"btn bp bw"));
    acts.appendChild(mkBtn("保存せずに戻る",function(){S.view="home";S.tab="home";render();},"btn bo bw"));
    main.appendChild(acts);
  }

  rfD();
}

/* ===== PRODUCTS ===== */
function renderProducts(c){
  var sc=h("div","scr",{textAlign:"center"});
  sc.appendChild(h("h1","serif",{fontSize:"22px",fontWeight:"500",marginBottom:"32px"},["商品提案"]));
  var ico=h("div","",{width:"80px",height:"80px",borderRadius:"50%",background:"var(--p50)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",border:"2px solid var(--p100)"});
  ico.appendChild(ic("ti-leaf",{fontSize:"36px",color:"var(--p400)"}));
  sc.appendChild(ico);
  sc.appendChild(h("h2","",{fontSize:"18px",fontWeight:"500",marginBottom:"8px"},["近日公開予定"]));
  sc.appendChild(h("p","",{fontSize:"14px",color:"var(--ts)",lineHeight:"1.8",maxWidth:"280px",margin:"0 auto 32px"},["RIMAN KOREAの商品データを登録すると、AI顔写真診断の結果に基づいてお客様一人ひとりに最適な商品を自動提案します。"]));
  var items=["肌タイプ別おすすめ商品","悩み別ケアプログラム","ステップ別スキンルーティン"];
  for(var i=0;i<items.length;i++){
    (function(item,idx){
      var r=h("div","",{display:"flex",alignItems:"center",gap:"12px",padding:"14px 16px",background:"var(--s2)",borderRadius:"12px",marginBottom:"8px",border:"1px solid var(--p100)",textAlign:"left"});
      r.appendChild(h("div","",{width:"28px",height:"28px",borderRadius:"50%",background:"var(--p50)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"500",color:"var(--p600)",flexShrink:"0"},[String(idx+1)]));
      r.appendChild(h("span","",{fontSize:"14px"},[item]));
      sc.appendChild(r);
    })(items[i],i);
  }
  c.appendChild(sc);
}

/* ===== INIT ===== */
render();
</script>
</body>
